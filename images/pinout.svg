<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
<title id="t">MC-16 chip to Raspberry Pi wiring</title>
<desc id="d">Pad A to Pi pin 1 for 3.3 V. Pad B to Pi pin 6 for ground. Pad C to Pi pin 5 for data. Pad D to Pi pin 3 for clock. Pi pins 2 and 4 carry 5 V and stay empty.</desc>
<rect width="960" height="480" fill="#ffffff"/>
<text x="40" y="30" font-size="20" font-weight="700" fill="#222">MC-16 chip board</text>
<text x="40" y="52" font-size="14" fill="#555">Chip side facing you, gold pads at the top</text>
<rect x="40" y="200" width="300" height="190" rx="8" fill="#1f6b45" stroke="#134a2f" stroke-width="2"/>
<g fill="#d9b24c" stroke="#8a6d1f">
<rect x="70" y="222" width="44" height="80"/>
<rect x="128" y="210" width="44" height="92"/>
<rect x="186" y="222" width="44" height="80"/>
<rect x="244" y="222" width="44" height="80"/>
</g>
<g font-size="22" font-weight="700" text-anchor="middle" fill="#222">
<text x="92" y="270">A</text><text x="150" y="270">B</text><text x="208" y="270">C</text><text x="266" y="270">D</text>
</g>
<rect x="132" y="314" width="116" height="48" rx="3" fill="#222"/>
<circle cx="145" cy="327" r="5" fill="#555"/>
<text x="192" y="343" font-size="13" text-anchor="middle" fill="#ddd">EEPROM</text>
<text x="190" y="380" font-size="12" text-anchor="middle" fill="#cfe6d8">Board marked QM2-3419</text>
<text x="600" y="30" font-size="20" font-weight="700" fill="#222">Raspberry Pi header</text>
<text x="600" y="52" font-size="14" fill="#555">Pin 1 end, tested on a Pi 4B</text>
<rect x="600" y="96" width="110" height="146" rx="6" fill="#2b2b2b"/>
<g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
<path d="M92 222 V68 H560 V116 H630" stroke="#e8730c"/>
<path d="M150 210 V84 H745 V216 H680" stroke="#6d4c2f"/>
<path d="M208 222 V186 H560 V216 H630" stroke="#2e7d32"/>
<path d="M266 222 V166 H630" stroke="#1565c0"/>
</g>
<g font-size="12" fill="#fff" text-anchor="middle" dominant-baseline="central">
<circle cx="630" cy="116" r="15" fill="#e8730c"/><text x="630" y="116">1</text>
<circle cx="680" cy="116" r="15" fill="#c62828"/><text x="680" y="116">2</text>
<circle cx="630" cy="166" r="15" fill="#1565c0"/><text x="630" y="166">3</text>
<circle cx="680" cy="166" r="15" fill="#c62828"/><text x="680" y="166">4</text>
<circle cx="630" cy="216" r="15" fill="#2e7d32"/><text x="630" y="216">5</text>
<circle cx="680" cy="216" r="15" fill="#6d4c2f"/><text x="680" y="216">6</text>
</g>
<g font-size="14" fill="#222">
<text x="760" y="121">Pin 2: 5 V, leave empty</text>
<text x="760" y="171">Pin 4: 5 V, leave empty</text>
<text x="760" y="221">Pin 6: ground</text>
</g>
<g font-size="14" fill="#222">
<rect x="40" y="418" width="14" height="14" fill="#e8730c"/><text x="62" y="430">A to pin 1, 3.3 V</text>
<rect x="240" y="418" width="14" height="14" fill="#6d4c2f"/><text x="262" y="430">B to pin 6, ground</text>
<rect x="450" y="418" width="14" height="14" fill="#2e7d32"/><text x="472" y="430">C to pin 5, data (GPIO3)</text>
<rect x="690" y="418" width="14" height="14" fill="#1565c0"/><text x="712" y="430">D to pin 3, clock (GPIO2)</text>
</g>
<text x="40" y="464" font-size="14" fill="#c62828" font-weight="700">The chip runs at 3.3 V. Connecting it to 5 V can destroy it.</text>
</svg>
